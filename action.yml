name: 'Setup Bitwarden Secrets Manager CLI'
description: 'Downloads and installs the Bitwarden Secrets Manager CLI (bws) in a isolated temp directory'

branding:
  icon: lock
  color: blue

inputs:
  version:
    description: 'Version of bws to install (e.g., 0.6.0, or latest)'
    required: false
    default: 'latest'
  github-token:
    description: 'GitHub token for API authentication to avoid rate limits'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Resolve bws Version
      id: resolve-version
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const inputVersion = '${{ inputs.version }}';
          
          if (inputVersion !== 'latest') {
            core.setOutput('version', inputVersion);
            return;
          }

          const releases = await github.paginate(github.rest.repos.listReleases, {
            owner: 'bitwarden',
            repo: 'sdk-sm',
          });

          const bwsVersions = releases
            .map(r => r.tag_name)
            .filter(tag => tag && tag.startsWith('bws-v'))
            .map(tag => tag.replace('bws-v', ''));

          if (bwsVersions.length === 0) {
            core.setFailed('Failed to find any bws-v releases in bitwarden/sdk-sm');
            return;
          }

          bwsVersions.sort((a, b) => {
            const pa = a.split('.').map(Number);
            const pb = b.split('.').map(Number);
            for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
              const na = pa[i] || 0;
              const nb = pb[i] || 0;
              if (na !== nb) return na - nb;
            }
            return 0;
          });

          const latestVersion = bwsVersions[bwsVersions.length - 1];
          core.info(`Resolved latest bws version: ${latestVersion}`);
          core.setOutput('version', latestVersion);

    - name: Cache bws Binary
      id: cache-bws
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/bin/bws
        key: bws-${{ runner.os }}-${{ steps.resolve-version.outputs.version }}

    - name: Download and Install bws
      if: steps.cache-bws.outputs.cache-hit != 'true'
      shell: bash
      run: |
        VERSION="${{ steps.resolve-version.outputs.version }}"
        echo "Cache miss. Downloading bws version ${VERSION}..."
        
        URL="https://github.com/bitwarden/sdk-sm/releases/download/bws-v${VERSION}/bws-x86_64-unknown-linux-gnu-${VERSION}.zip"
        
        curl -sSL -o bws.zip "$URL"
        unzip -q bws.zip
        chmod +x bws
        
        mkdir -p "${{ runner.temp }}/bin"
        mv bws "${{ runner.temp }}/bin/"
        rm bws.zip

    - name: Add bws to PATH
      shell: bash
      run: |
        echo "${{ runner.temp }}/bin" >> $GITHUB_PATH

    - name: Verify bws Installation
      shell: bash
      run: |
        bws --version
